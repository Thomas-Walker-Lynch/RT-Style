<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Test: RT Matrix</title>
    <script>
      {
        let dirpr_library = null;
        try{ dirpr_library = localStorage.getItem("RT.dirpr_library"); }catch(e){}
        window.RT = window.RT || {};
        RT.dirpr_library = RT.dirpr_library || dirpr_library || "https://style.ReasoningTechnology.com/Manuscript";
        document.write('<script src="' + RT.dirpr_library + '/Core/RT-Manuscript_make.js"><\/script>');
      }
    </script>
    <script>
      window.RT.theme_preference('inverse_wheat');
      window.RT.load('Layout/paginate');
      window.RT.load('Layout/article_tech_ref');
      window.RT.load('Element/theme_selector');
    </script>
  </head>
  <body>
    <RT·theme-selector></RT·theme-selector>
    <RT·article>
      <h1>Matrix Semantic Wrapper</h1>
      <p>Validates rigid formatting constraints, mathematical delimiter injection bounds, and exclusion of outer labels.</p>
      
      <RT·matrix layout-intention="row-vector">
        <RT·vector-meta>
          <RT·label>X</RT·label>
          <RT·label>Y</RT·label> 
        </RT·vector-meta>

        <RT·vector>
          <RT·name>V0</RT·name>
          <RT·e>1</RT·e>
          <RT·e>0</RT·e>
        </RT·vector>
        
        <RT·vector>
          <RT·e>0</RT·e>
          <RT·e>1</RT·e>
        </RT·vector>
      </RT·matrix>
    </RT·article>
  </body>
</html>
